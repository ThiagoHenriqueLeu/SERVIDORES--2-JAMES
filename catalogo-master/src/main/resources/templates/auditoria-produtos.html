<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Auditoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>
<div sec:authorize="hasRole('ADMIN')">
    <nav class="navbar navbar-dark app-navbar mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/produtos}">FATEC Catalogo</a>
        </div>
    </nav>

    <main class="container app-shell">
        <div class="panel">
            <div class="panel-header">
                <div>
                    <h2 class="page-title">Auditoria de Estoque</h2>
                    <p class="page-subtitle">Historico de alteracoes feitas nos produtos.</p>
                </div>
                <a th:href="@{/produtos}" class="btn btn-outline-secondary">Voltar</a>
            </div>

            <div class="panel-body">
                <div class="table-responsive border rounded">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Campo</th>
                            <th>Antes</th>
                            <th>Depois</th>
                            <th>Motivo</th>
                            <th>Usuario</th>
                            <th>Data</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="a : ${auditorias}">
                            <td>
                                <span class="text-muted" th:text="${'#' + a.idProduto}"></span>
                            </td>
                            <td th:text="${a.nomeProduto}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${a.campoAlterado}"></span>
                            </td>
                            <td class="audit-value audit-before" th:text="${a.valorAnterior}"></td>
                            <td class="audit-value audit-after" th:text="${a.valorNovo}"></td>
                            <td th:text="${a.motivo != null && !a.motivo.isBlank() ? a.motivo : '-'}"></td>
                            <td th:text="${a.usuario}"></td>
                            <td>
                                <span th:text="${#temporals.format(a.dataAlteracao, 'dd/MM/yyyy HH:mm:ss')}"></span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(auditorias)}">
                            <td colspan="8" class="empty-state">Nenhuma alteracao registrada.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
