<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e9ecef, #dee2e6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .bg-dark-blue {
            background: linear-gradient(135deg, #0d1b2a, #1b263b) !important;
        }

        .navbar {
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-header {
            border-radius: 12px 12px 0 0 !important;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px;
            transition: 0.2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: #1b263b;
            box-shadow: 0 0 0 0.2rem rgba(27,38,59,0.25);
        }

        .btn-dark-blue {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #fff;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-dark-blue:hover {
            background: linear-gradient(135deg, #1b263b, #415a77);
            transform: scale(1.03);
        }

        .btn-outline-secondary {
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-outline-secondary:hover {
            transform: scale(1.03);
        }

        /* botão + categoria */
        button[data-bs-target="#modalCategoria"] {
            min-width: 45px;
            font-size: 18px;
            font-weight: bold;
        }

        /* modal */
        .modal-content {
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            border-radius: 12px 12px 0 0;
        }

        .modal-body input {
            border-radius: 8px;
        }

        /* feedback erro */
        .invalid-feedback {
            font-size: 0.85rem;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark-blue mb-4">
    <div class="container">
        <a class="navbar-brand" href="/produtos">FATEC - Catálogo</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow mx-auto" style="max-width: 500px;">

        <div class="card-header bg-dark-blue text-white">
            <h2 class="mb-0">Novo Produto</h2>
        </div>

        <div class="card-body">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">

                <input type="hidden" th:field="*{idProduto}">

                <!-- NOME -->
                <div class="mb-3">
                    <label class="form-label">Nome do Produto</label>
                    <input type="text" th:field="*{nome}" class="form-control"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}">
                    </div>
                </div>

                <!-- VALOR -->
                <div class="mb-3">
                    <label class="form-label">Preço (R$)</label>
                    <input type="number" step="0.01" th:field="*{valor}" class="form-control"
                           th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid'">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('valor')}"
                         th:errors="*{valor}">
                    </div>
                </div>

                <!-- CATEGORIA -->
                <div class="mb-3">
                    <label class="form-label">Categoria</label>

                    <div class="d-flex gap-2">
                        <select th:field="*{categoria}" class="form-select"
                                th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">

                            <option value="">Selecione</option>

                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.id}"
                                    th:text="${cat.nome}">
                            </option>

                        </select>

                        <button type="button" class="btn btn-dark-blue"
                                data-bs-toggle="modal" data-bs-target="#modalCategoria">
                            +
                        </button>
                    </div>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('categoria')}">
                        Selecione uma categoria
                    </div>
                </div>

                <!-- BOTÕES -->
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-dark-blue">Salvar</button>
                    <a href="/produtos" class="btn btn-outline-secondary">Voltar</a>
                </div>

            </form>
        </div>

    </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalCategoria" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header bg-dark-blue text-white">
                <h5 class="modal-title">Nova Categoria</h5>
                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="formCategoria">
                    <div class="mb-3">
                        <label class="form-label">Nome da Categoria</label>
                        <input type="text" id="nomeCategoria" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-dark-blue w-100">
                        Salvar Categoria
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById("formCategoria").addEventListener("submit", function(e) {
        e.preventDefault();

        const nome = document.getElementById("nomeCategoria").value;

        fetch("/categorias/salvar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ nome: nome })
        })
        .then(response => response.json())
        .then(data => {

            // 🔥 pega o select correto
            const select = document.querySelector("select[name='categoria']");

            const option = document.createElement("option");
            option.value = data.id;
            option.text = data.nome;
            option.selected = true;

            select.appendChild(option);

            // fecha modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalCategoria'));
            modal.hide();

            document.getElementById("formCategoria").reset();
        })
        .catch(error => console.error(error));
    });
</script>

</body>
</html>
