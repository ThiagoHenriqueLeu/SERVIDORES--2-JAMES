<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e9ecef, #dee2e6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .bg-dark-blue {
            background: linear-gradient(135deg, #0d1b2a, #1b263b) !important;
        }

        .navbar {
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-header {
            border-radius: 12px 12px 0 0 !important;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
            transition: 0.2s;
        }

        .form-control:focus {
            border-color: #1b263b;
            box-shadow: 0 0 0 0.2rem rgba(27,38,59,0.25);
        }

        .btn-dark-blue {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #fff;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-dark-blue:hover {
            background: linear-gradient(135deg, #1b263b, #415a77);
            transform: scale(1.03);
        }

        .btn-outline-secondary {
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-outline-secondary:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark-blue mb-4">
    <div class="container">
        <a class="navbar-brand" href="/produtos">FATEC - Gerenciador de Catálogo</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 500px;">

        <div class="card-header bg-dark-blue text-white">
            <h2 class="mb-0">Editar Produto</h2>
        </div>

        <div class="card-body">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">

                <input type="hidden" th:field="*{idProduto}">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" th:field="*{nome}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Valor</label>
                    <input type="number" step="0.01" th:field="*{valor}" class="form-control" required>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-dark-blue">Atualizar</button>
                    <a href="/produtos" class="btn btn-outline-secondary">Voltar</a>
                </div>

            </form>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
