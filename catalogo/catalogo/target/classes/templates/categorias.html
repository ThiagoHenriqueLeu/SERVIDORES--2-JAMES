<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Categorias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e9ecef, #dee2e6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .bg-dark-blue {
            background: linear-gradient(135deg, #0d1b2a, #1b263b) !important;
        }

        .navbar {
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-header {
            border-radius: 12px 12px 0 0 !important;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
            transition: 0.2s;
        }

        .form-control:focus {
            border-color: #1b263b;
            box-shadow: 0 0 0 0.2rem rgba(27,38,59,0.25);
        }

        .btn-dark-blue {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #fff;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-dark-blue:hover {
            background: linear-gradient(135deg, #1b263b, #415a77);
            transform: scale(1.03);
        }

        .btn-danger {
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-danger:hover {
            transform: scale(1.03);
        }

        .btn-outline-dark,
        .btn-secondary {
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-outline-dark:hover,
        .btn-secondary:hover {
            transform: scale(1.03);
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
        }

        .table-dark-blue {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #fff;
        }

        .table tbody tr {
            transition: 0.2s;
        }

        .table tbody tr:hover {
            background-color: #f1f3f5;
            transform: scale(1.01);
        }

        .alert {
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark-blue mb-4">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="/produtos">FATEC - Categorias</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow">

        <!-- 🔥 FORM (CRIAR / EDITAR) -->
        <div class="card-body border-bottom">

            <form th:action="@{/categorias/salvar-form}" th:object="${categoria}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-2 align-items-end">

                    <div class="col-md-8">
                        <label class="form-label">Nome da Categoria</label>
                        <input type="text" th:field="*{nome}" class="form-control" required>
                    </div>

                    <div class="col-md-4 d-flex gap-2">

                        <button type="submit" class="btn btn-dark-blue w-100">
                            <span th:text="${categoria.id != null} ? 'Atualizar' : 'Cadastrar'"></span>
                        </button>

                        <a href="/categorias" class="btn btn-secondary w-100">Limpar</a>

                        <!-- 🔥 NOVO BOTÃO -->
                        <a href="/produtos" class="btn btn-outline-dark w-100">
                            Voltar
                        </a>

                    </div>

                </div>

            </form>

        </div>

        <!-- 🔥 LISTA -->
        <div class="card-body">

            <table class="table table-hover">
                <thead class="table-dark-blue">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="c : ${categorias}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.nome}"></td>

                    <td class="text-center">

                        <a th:href="@{/categorias/editar/{id}(id=${c.id})}"
                           class="btn btn-sm btn-dark-blue">
                            Editar
                        </a>

                        <a th:href="@{/categorias/excluir/{id}(id=${c.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Excluir esta categoria?')">
                            Excluir
                        </a>

                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(categorias)}" class="alert alert-info text-center">
                Nenhuma categoria cadastrada.
            </div>

        </div>
        <div th:if="${param.erro}" class="alert alert-danger text-center">
            Não é possível excluir categoria com produtos vinculados!
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
